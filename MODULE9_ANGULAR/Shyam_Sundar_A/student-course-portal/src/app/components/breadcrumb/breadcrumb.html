<nav class="breadcrumb" *ngIf="crumbs.length > 1">
  <ng-container *ngFor="let crumb of crumbs; let last = last">
    <a [routerLink]="crumb.url" *ngIf="!last">{{ crumb.label }}</a>
    <span *ngIf="last" class="current">{{ crumb.label }}</span>
    <span *ngIf="!last" class="separator">/</span>
  </ng-container>
</nav>
