<section class="page-container">
  <h1>Course Details</h1>

  <p class="error-message" *ngIf="hasError">Unable to load course details.</p>

  <div class="details-card" *ngIf="(course$ | async) as course">
    <h2>{{ course.name }}</h2>
    <p><strong>Code:</strong> {{ course.code }}</p>
    <p><strong>Credits:</strong> {{ course.credits | creditLabel }}</p>
    <p><strong>Grade Status:</strong> {{ course.gradeStatus }}</p>
  </div>

  <a class="back-link" routerLink="/courses">Back to Courses</a>
</section>
