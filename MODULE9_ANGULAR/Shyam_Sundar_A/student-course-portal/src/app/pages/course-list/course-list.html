<section class="page-container">
  <h1>Available Courses</h1>

  <p>
    Browse all courses available in the Student Course Portal.
  </p>

  <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

  <p class="error-message" *ngIf="hasError && !isLoading">Unable to load courses.</p>

  <ng-container *ngIf="!isLoading && !hasError">
    <div class="course-grid" *ngIf="courses.length; else noCourses">
      <div class="course-grid-item" *ngFor="let c of courses; trackBy: trackByCourseId">
        <app-course-card
          [course]="c"
          appHighlight="lightblue"
          (enrollRequested)="onEnroll($event)">
        </app-course-card>
        <a class="view-details-link" [routerLink]="['/courses', c.id]">View Details</a>
      </div>
    </div>

    <ng-template #noCourses>
      <p>No courses available.</p>
    </ng-template>
  </ng-container>

  <p *ngIf="selectedCourseId">
    Selected course ID:
    {{ selectedCourseId }}
  </p>
</section>
