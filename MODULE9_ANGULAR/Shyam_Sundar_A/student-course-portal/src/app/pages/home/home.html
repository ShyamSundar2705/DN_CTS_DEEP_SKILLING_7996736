<section class="home-container">

  <div class="welcome-section">
    <h1>{{ portalName }}</h1>

    <p>
      Browse available courses, manage your enrollments,
      view your student profile, and track your academic progress.
    </p>
  </div>

  <div class="stats-row">

    <div class="stat-card">
      <h2>12</h2>
      <p>Courses Available</p>
    </div>

    <div class="stat-card">
      <h2>3</h2>
      <p>Enrolled</p>
    </div>

    <div class="stat-card">
      <h2>8.22</h2>
      <p>GPA</p>
    </div>

  </div>

  <div class="binding-demo">

    <button [disabled]="!isPortalActive" (click)="onEnrollClick()">
      Enroll Now
    </button>

    <p>{{ message }}</p>

    <!-- [disabled] is one-way; [(ngModel)] syncs component and view both ways -->
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Search courses">

    <p>
      Searching for:
      {{ searchTerm }}
    </p>

  </div>

</section>
